name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    # A weekly cold run. The install job below restores a warm cache, which
    # every step's `command -v` guard is then satisfied by, so a cached run
    # exercises almost none of the install paths it exists to test. This run
    # skips the restore and installs everything from scratch.
    - cron: '0 4 * * 1'

# The install job below runs scripts/install.sh with this token in its
# environment, so the workflow gets the narrowest scope that still works: the
# token is only ever used to lift GitHub's 60-request-per-hour anonymous API
# limit on the release lookups.
permissions:
  contents: read

# One run per branch or pull request. A push that supersedes an in-flight run
# cancels it rather than queueing behind it; the install job restores and saves
# a cache over a gigabyte, so two of them racing is worth avoiding. Runs on main
# are not cancelled, since each one is the record for a distinct commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # A path filter and a checkout; anything longer than this is a hung runner.
    timeout-minutes: 10
    outputs:
      install: ${{ steps.filter.outputs.install }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for install script changes
        # Skipped on the weekly cold run, which has no base ref to diff
        # against; the install job's `if` admits that event on its own.
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # install-macos-arm64.sh is deliberately excluded: this runner is
          # ubuntu-latest, so a macOS-only script change can't be exercised here
          filters: |
            install:
              - 'scripts/install.sh'
              - 'scripts/install.py'
              - 'scripts/installer/**'
              - 'scripts/legacy-step.sh'
              - 'scripts/install-common.sh'
              - 'scripts/install-linux.sh'
              - 'scripts/verify-install.sh'

  lint:
    runs-on: ubuntu-latest
    # A cold devShell build is the slow case here, measured at 74s.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, for the gitleaks history scan below. The default
          # shallow fetch gives it one commit to look at, which would report
          # clean without having read the history it exists to read. 378
          # commits and 745 KB, so the whole clone is cheaper than the step.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # v5 talks to the cache service API GitHub has since retired, so every
      # restore came back `Cache service responded with 400`, and its save then
      # died on the root-owned files under /nix/var that it tried to tar
      # (temproots, gc.lock, db/reserved) — `tar failed with exit code 2`. The
      # store was therefore neither restored nor saved, and the repo held no
      # nix-* cache entry at all, leaving `nix develop` to re-fetch the whole
      # devShell closure on every run: 74s for the first invocation against 6s
      # for the second, warm one. v7 moves to the current cache API and caches
      # /nix alone by default.
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          # A flake.lock bump changes the primary key but almost none of the
          # closure, so fall back to the newest store from any earlier lock
          # rather than starting from an empty one.
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Format check
        run: nix develop --command make fmt-ci

      - name: Create placeholder SSH identity file
        # sshconfig-lint's MISSING_IDENTITY check verifies IdentityFile paths
        # exist on disk; the runner has no real key, so stub one out.
        run: mkdir -p ~/.ssh && touch ~/.ssh/id_benmandrew

      - name: Lint check
        run: nix develop --command make lint

      # The installer's own tests. They run the runner over stand-in steps and
      # call real bash helpers through legacy-step.sh, in about a second. The
      # install job below is the end-to-end run.
      - name: Installer unit tests
        run: nix develop --command make test-py

      # `make lint` scans the working tree. This reads every commit, so a
      # secret that was committed and then deleted is still caught; it is kept
      # out of `lint` because it needs the full history a local checkout does
      # not always have.
      - name: Secret scan (history)
        run: nix develop --command make lint-secrets-history

  install:
    runs-on: ubuntu-latest
    # This job builds tmux from source and saves a 1.1 GB cache, so it is the
    # one that most needs a ceiling: without one a wedged step burns the full
    # six-hour default before anyone hears about it.
    timeout-minutes: 90
    needs: [lint, changes]
    if: needs.changes.outputs.install == 'true' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Every pinned version, hashed. A pin bump that restored a cache built
      # under the old pins left each step's `command -v` guard satisfied by the
      # old tool, so the new version went untested until the weekly cold run.
      # Both cache keys below lead with this, so a cache is only ever restored
      # into a run with the same pins.
      - name: Hash pinned versions
        id: pins
        if: github.event_name != 'schedule'
        run: |
          hash="$(grep -hE '^[A-Z_]+_VERSION=' scripts/install-common.sh scripts/install-linux.sh | sha256sum | cut -c1-16)"
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Cache installed tools
        # Skipped on the weekly cold run — see the `schedule:` trigger above.
        if: github.event_name != 'schedule'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/.local/share/zinit
            ~/.fzf
            ~/.local
            ~/.tmux
            ~/.config/tmux/plugins
            /opt/nvim-linux-x86_64
            /usr/local/bin
            /usr/local/lib/node_modules
          key: install-${{ runner.os }}-${{ steps.pins.outputs.hash }}-${{ hashFiles('scripts/install.sh', 'scripts/install.py', 'scripts/installer/**', 'scripts/legacy-step.sh', 'scripts/install-common.sh', 'scripts/install-linux.sh') }}
          # The primary key can never hit. It hashes the installer, and this
          # job only runs when part of it changed, so the key is new on every
          # run that reaches here — measured as a 0s restore and a 3m save of a
          # 1.1 GB cache nothing would ever read. The prefix restores the
          # previous run's tools instead, which the install steps then skip
          # over, leaving the run to exercise whatever the edit actually
          # changed. It carries the pin hash, so a run with different pins
          # restores nothing and installs every tool afresh.
          restore-keys: |
            install-${{ runner.os }}-${{ steps.pins.outputs.hash }}-

      # The opam root, cached on its own. Outside the cache above, every run
      # rebuilt it: 437s of a 521s install job on 5 September, the runner
      # having no OCaml, so the switch compiles ocaml-base-compiler before
      # ocaml-lsp-server and ocamlformat. The key covers only what decides the
      # switch's contents (the opam pin, the two functions that build it, and
      # the runner image), so it hits across unrelated script edits, and a hit
      # saves nothing. No restore-keys: a change to that code should rebuild
      # from scratch, which is what it needs testing against. install_opam
      # skips init and both builds when ~/.opam exists, so a hit here with a
      # miss above only re-downloads the opam binary.
      - name: Hash opam setup
        id: opam
        if: github.event_name != 'schedule'
        run: |
          hash="$({
            echo "${ImageOS:-}"
            grep -h '^OPAM_VERSION=' scripts/install-common.sh
            sed -n '/^install_opam()/,/^}/p;/^install_ocaml_tools()/,/^}/p' scripts/install-common.sh
          } | sha256sum | cut -c1-16)"
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Cache opam root
        if: github.event_name != 'schedule'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The download cache is only source tarballs for builds already done.
          path: |
            ~/.opam
            !~/.opam/download-cache
          key: opam-${{ runner.os }}-${{ steps.opam.outputs.hash }}

      - name: Run install script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/install.sh

      - name: Verify installed tools
        run: bash scripts/verify-install.sh
