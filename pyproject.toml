# Configuration for the linters that read scripts/installer. There is no
# package to build: scripts/install.sh runs the code in place, on the standard
# library alone.

[tool.ruff]
# The floor scripts/install.sh enforces. The Xcode Command Line Tools ship
# Python 3.9.6.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

# mypy has dropped Python 3.9 as a target, so it checks against 3.10. The 3.9
# floor is held by ruff above, which refuses newer syntax, and by running the
# tests on the Command Line Tools interpreter (see PLAN.md).
[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "scripts"
