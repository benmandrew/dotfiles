[files]
# Doom's module template, copied as upstream wrote it. Its comments are word
# play ("tfel ot thgir", "{ba,z,fi}sh") that no dictionary can tell from a typo.
extend-exclude = ["home/dot_config/doom/init.el"]

[default.extend-words]
# catppuccin theme variable prefix
thm = "thm"
# gpg's colon-listing record type for a fingerprint line, matched by
# apt.key_fingerprints in scripts/installer/apt.py
fpr = "fpr"
# TeX Live installer tarball, install-tl-unx.tar.gz, fetched by install_latex
# in scripts/installer/steps/latex.py
unx = "unx"
