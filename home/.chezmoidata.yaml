## Data available to every template as top-level keys. Resolved at `chezmoi
## apply` time, so each machine's rendered files carry only its own values.

atuin:
  ## Short name recorded against every command, in place of the hostname —
  ## `mac` rather than `Ben-MacBook.local`. The [ui] host column in
  ## dot_config/atuin/private_config.toml is narrow, and a synced result is
  ## only useful if the machine it came from is readable at a glance.
  ##
  ## Keyed on `.chezmoi.hostname`, which is the hostname with any domain
  ## stripped and the case left as the machine reports it. A machine missing
  ## from this map exports nothing and keeps atuin's own default.
  hostnames:
    Ben-MacBook: mac
    ben: manc
    emel: emel
    fisk: fisk
    windows: win
    av1: av1
    av2: av2
    av3: av3

icons:
  ## Launcher icons that run_onchange_after_recolour-icons.sh.tmpl redraws in
  ## the palette of benmandrew.com, on Linux. Each key is a .desktop filename,
  ## and an app absent from a machine is skipped. Firefox and Chrome each ship
  ## two files, the snap or apt one and a legacy alias, so both are listed.
  ##
  ## `tone` maps the icon's luminance onto the stops, darkest first. `tile`
  ## does the same with more contrast and sets it on a rounded tile, for an
  ## icon with too little shading to survive the mapping.
  stops: ["#141414", "#d08949", "#ebc587"]
  tile_fill: "#2c2925"
  tile_edge: "#d08949"
  apps:
    firefox_firefox.desktop: tone
    firefox.desktop: tone
    nemo.desktop: tone
    md.obsidian.Obsidian.desktop: tone
    zotero.desktop: tone
    org.gnome.eog.desktop: tone
    org.pwmt.zathura.desktop: tone
    libreoffice-writer.desktop: tone
    org.gnome.Calculator.desktop: tone
    gnome-control-center.desktop: tone
    com.microsoft.VSCode.desktop: tone
    ghostty_ghostty.desktop: tone
    google-chrome.desktop: tone
    com.google.Chrome.desktop: tone
  ## Arguments added after the program on each Exec= line of an app's copy.
  ## The copy replaces any hand-made one, so a flag that one carried goes here.
  exec_args:
    com.microsoft.VSCode.desktop: --disable-gpu-rasterization
  ## Environment variables set on each Exec= line of an app's copy.
  exec_env:
    ## The snap's GTK 4.22 draws its own pointer on GNOME 42, which lacks the
    ## cursor-shape protocol, and draws it too large at any size setting.
    ## Under XWayland the shell draws it.
    ghostty_ghostty.desktop:
      GDK_BACKEND: x11

desktop_keys:
  ## GNOME and Pop Shell keybindings, which
  ## run_once_configure-gnome-keybindings.sh sets through gsettings. One
  ## modifier per layer: Super for the desktop, the tmux prefix for the
  ## terminal, Ctrl for an app's tabs.
  ## Within a layer, h/j/k/l focus, with Shift move, with Alt resize.
  ##
  ## schema is an alias the script expands: wm, shell, mutter, media or pop.
  ## accel is a GTK accelerator. A trailing # in a key or accel runs from 1 to
  ## 9. Setting a key replaces all of Pop Shell's defaults for it, several of
  ## which sit on Super+arrows.
  bindings:
    ## GNOME takes a key before Pop Shell, so minimise moved off Super+H and
    ## lock screen off Super+L.
    - {group: Desktop windows, desc: Focus the window to the left, schema: pop, key: focus-left, accel: "<Super>h"}
    - {group: Desktop windows, desc: Focus the window below, schema: pop, key: focus-down, accel: "<Super>j"}
    - {group: Desktop windows, desc: Focus the window above, schema: pop, key: focus-up, accel: "<Super>k"}
    - {group: Desktop windows, desc: Focus the window to the right, schema: pop, key: focus-right, accel: "<Super>l"}
    - {group: Desktop windows, desc: Move the window left, schema: pop, key: tile-move-left-global, accel: "<Shift><Super>h"}
    - {group: Desktop windows, desc: Move the window down, schema: pop, key: tile-move-down-global, accel: "<Shift><Super>j"}
    - {group: Desktop windows, desc: Move the window up, schema: pop, key: tile-move-up-global, accel: "<Shift><Super>k"}
    - {group: Desktop windows, desc: Move the window right, schema: pop, key: tile-move-right-global, accel: "<Shift><Super>l"}
    - {group: Desktop windows, desc: Float or tile the window, schema: pop, key: toggle-floating, accel: "<Super>c"}
    - {group: Desktop windows, desc: Minimise the window, schema: wm, key: minimize, accel: "<Super>comma"}
    ## Pop Shell's monitor move carries floating windows as well as tiled
    ## ones. The monitors are stacked vertically.
    - {group: Desktop windows, desc: Move the window to the monitor above, schema: pop, key: pop-monitor-up, accel: "<Super><Shift>Up"}
    - {group: Desktop windows, desc: Move the window to the monitor below, schema: pop, key: pop-monitor-down, accel: "<Super><Shift>Down"}

    ## Pop Shell resizes and swaps only in its tiling mode, whose keys work
    ## only while the mode is on. Alt resizes there as it would elsewhere.
    - {group: Desktop tiling mode, desc: Start tiling mode, schema: pop, key: tile-enter, accel: "<Super>Return"}
    - {group: Desktop tiling mode, desc: Keep the changes and leave, schema: pop, key: tile-accept, accel: "Return"}
    - {group: Desktop tiling mode, desc: Undo the changes and leave, schema: pop, key: tile-reject, accel: "Escape"}
    - {group: Desktop tiling mode, desc: Move the window left, schema: pop, key: tile-move-left, accel: "h"}
    - {group: Desktop tiling mode, desc: Move the window down, schema: pop, key: tile-move-down, accel: "j"}
    - {group: Desktop tiling mode, desc: Move the window up, schema: pop, key: tile-move-up, accel: "k"}
    - {group: Desktop tiling mode, desc: Move the window right, schema: pop, key: tile-move-right, accel: "l"}
    - {group: Desktop tiling mode, desc: Make the window narrower, schema: pop, key: tile-resize-left, accel: "<Alt>h"}
    - {group: Desktop tiling mode, desc: Make the window taller, schema: pop, key: tile-resize-down, accel: "<Alt>j"}
    - {group: Desktop tiling mode, desc: Make the window shorter, schema: pop, key: tile-resize-up, accel: "<Alt>k"}
    - {group: Desktop tiling mode, desc: Make the window wider, schema: pop, key: tile-resize-right, accel: "<Alt>l"}
    - {group: Desktop tiling mode, desc: Swap with the window to the left, schema: pop, key: tile-swap-left, accel: "<Control>h"}
    - {group: Desktop tiling mode, desc: Swap with the window below, schema: pop, key: tile-swap-down, accel: "<Control>j"}
    - {group: Desktop tiling mode, desc: Swap with the window above, schema: pop, key: tile-swap-up, accel: "<Control>k"}
    - {group: Desktop tiling mode, desc: Swap with the window to the right, schema: pop, key: tile-swap-right, accel: "<Control>l"}

    ## Super+N matches prefix N for tmux window N.
    - {group: Desktop workspaces, desc: "Go to workspace 1 to 9", schema: wm, key: "switch-to-workspace-#", accel: "<Super>#"}
    - {group: Desktop workspaces, desc: "Move the window to workspace 1 to 9", schema: wm, key: "move-to-workspace-#", accel: "<Super><Shift>#"}
    - {group: Desktop workspaces, desc: Go to the workspace on the left, schema: wm, key: switch-to-workspace-left, accel: "<Super>Left"}
    - {group: Desktop workspaces, desc: Go to the workspace on the right, schema: wm, key: switch-to-workspace-right, accel: "<Super>Right"}
    ## Super+Left/Right go between workspaces, and Shift moves the window
    ## with them, as Shift+Up/Down does between monitors.
    - {group: Desktop workspaces, desc: Move the window a workspace left, schema: wm, key: move-to-workspace-left, accel: "<Super><Shift>Left"}
    - {group: Desktop workspaces, desc: Move the window a workspace right, schema: wm, key: move-to-workspace-right, accel: "<Super><Shift>Right"}

    - {group: Desktop layout, desc: Change the split direction, schema: pop, key: tile-orientation, accel: "<Super>g"}
    - {group: Desktop layout, desc: Stack or unstack the windows, schema: pop, key: toggle-stacking-global, accel: "<Shift><Super>s"}
    - {group: Desktop layout, desc: Turn tiling on or off, schema: pop, key: toggle-tiling, accel: "<Super>w"}

    ## Moved off Super+V while Forge held that key.
    - {group: Desktop session, desc: Show the notification list, schema: shell, key: toggle-message-tray, accel: "<Super>m"}
    - {group: Desktop session, desc: Lock the screen, schema: media, key: screensaver, accel: "<Control><Alt>l"}

  ## Bindings set to nothing. Ctrl+Alt+arrows and Ctrl+Alt+letter go back to
  ## apps, which use them for multiple cursors. Workspaces run left to right,
  ## so up and down have nothing to do, as left and right have nothing between
  ## monitors. switch-to-application-# took Super+N. Mutter's half-screen
  ## tiling took Super+Left/Right, and Pop Shell does the tiling. GNOME's own
  ## monitor moves give way to Pop Shell's. Pop Shell's workspace and
  ## left/right monitor moves sat on Super+Shift+arrows and Super+Shift+h/l,
  ## and its launcher needs pop-launcher, which nothing installs.
  cleared:
    wm: [switch-to-workspace-up, switch-to-workspace-down, move-to-workspace-up, move-to-workspace-down, move-to-monitor-left, move-to-monitor-right, move-to-monitor-up, move-to-monitor-down]
    shell: ["switch-to-application-#"]
    mutter: [toggle-tiled-left, toggle-tiled-right]
    pop: [pop-workspace-up, pop-workspace-down, pop-monitor-left, pop-monitor-right, activate-launcher]
