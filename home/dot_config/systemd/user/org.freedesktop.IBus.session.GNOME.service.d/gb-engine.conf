# Set ibus's engine to gb at login.
#
# GNOME under Wayland resolves an xkb-only input source in mutter and never
# tells ibus which engine to use, so the daemon comes up on its built-in
# default of xkb:us::eng and stays there for the life of the session. Setting
# sources, preload-engines and engines-order to gb does not change that; all
# three read back as gb on a machine whose live engine is still us.
#
# Nothing types US as a result, since mutter and XWayland both follow GNOME's
# own source list. The wrong answer only reaches an application that asks ibus
# directly, which is the path WezTerm took before use_ime was turned off.
#
# The unit is Type=dbus, so ExecStartPost runs once ibus-daemon owns
# org.freedesktop.IBus and is able to answer, with no sleep needed. The leading
# `-` stops a failure here failing the unit, which would leave the session with
# no input method at all.
[Service]
ExecStartPost=-/usr/bin/ibus engine xkb:gb::eng
