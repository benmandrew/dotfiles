## Every key here is set to a non-default, or is a default worth pinning
## because a future release changing it would be a surprise. `atuin
## default-config` prints the full annotated set.

## The sync server, reachable only from the tailnet. This name is already public
## — the https cert comes from Let's Encrypt, so it is in the certificate
## transparency logs — and it is not what gates access. That is the tailnet ACL:
## a host without an accepted WireGuard key gets no route, and MagicDNS does not
## resolve .ts.net for non-members. Do not put this node behind Funnel, which
## would expose it to the open internet with only atuin's own login in front.
sync_address = "https://atuin.yattle-vernier.ts.net"
auto_sync = true

## Only checked when a command runs, so the real interval is at least this.
sync_frequency = "5m"

## The install scripts own the atuin version — brew on macOS, the release
## tarball on Linux — so its own check only ever nags about an update that
## `atuin update` must not apply.
update_check = false

dialect = "uk"

## Enter puts the command on the prompt rather than running it, so a selection
## can be read before it executes. Tab does the same. This is atuin's old
## behaviour; new installs default to enter_accept = true.
enter_accept = false

search_mode = "fuzzy"
filter_mode = "global"

## Draw in the bottom rows of the pane rather than taking the whole screen. The
## tmux popup ([tmux] below) is the alternative and is deliberately off.
style = "compact"
inline_height = 20

## The preview shows the selected command in full, wrapped, since the results
## list truncates it to the width left over after the other columns. It renders
## text atuin already holds — unlike the fzf-tab previews in dot_zshrc.tmpl,
## nothing is executed to produce it.
show_preview = true

## Strip the chrome. The numeric shortcuts move as results reorder, the help row
## repeats what muscle memory already knows, and the tab strip only matters when
## switching to the inspector, which the keyboard shortcut still reaches.
show_numeric_shortcuts = false
show_help = false
show_tabs = false

## Escape leaves the line as it was before ^R, so an aborted search costs
## nothing.
exit_mode = "return-original"

## Stops the relative-time column animating. It renders `51s ago` and counts up
## in place, which is the only thing moving on screen while the list is being
## read. The times still render, they just settle. Also settable as NO_MOTION=1.
prefers_reduced_motion = true

## Drops commands matching atuin's built-in patterns — AWS key ids, GitHub PATs,
## Slack tokens and webhooks, Stripe keys — before they are ever written. On by
## default; pinned because it is the reason this history is safe to sync at all.
secrets_filter = true

## Commands never recorded, as unanchored regexes. The built-in secrets_filter
## above catches known token shapes; this is for anything local to these
## machines that it cannot know about.
# history_filter = [
#   "^curl .*-H .*[Aa]uthorization",
# ]

## Directories whose commands are never recorded, as unanchored regexes.
# cwd_filter = [
#   "^/very/secret/area",
# ]

[keys]
## Both of these default to true, and both fire while the cursor is being moved
## through a query that is still being edited — the left arrow at column 0
## closes the picker, and the right arrow at the end of the line accepts the
## selection the way Tab does. Off, the arrows only ever move the cursor.
exit_past_line_start = false
accept_past_line_end = false

## scroll_exits is left at its default true: up and down past the ends of the
## list is the deliberate way out, and unlike the two above it is not reachable
## by accident while editing.

[search]
## Show commands from any shell, including entries imported from ~/.zsh_history
## that predate atuin recording which shell ran them.
shells = "all"

## The modes ^R cycles through, in order. The default list has six; `workspace`
## never appears because `workspaces` is false, `session` and `session-preload`
## scope to one shell instance, which is rarely what is wanted from a synced
## history. Trimming the cycle to three makes the `[GLOBAL]` indicator in the
## bottom-left worth reading. `host` earns its place now that hosts read as
## `mac` and `fisk` rather than as full hostnames.
filters = ["global", "host", "directory"]

[tmux]
## Inline in the pane, matching how fzf's ^R behaves today. A popup would float
## over the pane instead; flip this to true to try it.
enabled = false

[daemon]
## Sync runs from the shell hook, so there is no background process to manage.
## Enabling this would also want `brew services start atuin` on macOS.
enabled = false

[ui]
## `host` is not in the default column set. It earns its place here because the
## whole point of syncing is that a result may have come from another machine,
## and without it there is no way to tell which.
##
## Width 5 rather than the default 15. The column is a fixed field, not sized to
## its contents, so the default spends 15 columns on `mac` as readily as on a
## full hostname. Every name in atuin.hostnames (.chezmoidata.yaml) is four
## characters or fewer, and the field includes the gap before the command, so 5
## is the tight fit: 4 of name and 1 of separator. A name that outgrows it is
## truncated with `…` rather than overflowing, so the only cost of getting this
## wrong is a shortened host, and widening it is a one-character edit here.
##
## `duration` is dropped, which the default set includes, so this list diverges
## from the default by a removal as well as by the addition above. The width it
## frees goes to `command`, the column with expand = true, which is the same
## trade the host width of 5 was made for. What goes with it is the only
## exit-status signal in the set. Each column's colour is fixed in atuin's code,
## the theme deciding only what each meaning renders as, and duration drew
## Annotation blue except when the command exited non-zero, where it drew
## AlertError red — a `make watch` row that exited 130 drew red while every blue
## duration in the same frame had exited 0. Time draws Guidance grey and host
## draws Annotation blue whatever the exit code, so nothing marks a failed
## command now. An `exit` column would restore the signal.
##
## `time` takes an explicit width of 5, against a default of 9. atuin's own
## embedded documentation says the default is 8, which is wrong: an explicit
## `width = 8` renders one column narrower than leaving it out. The longest
## string the column ever produces is 8 characters, `11mo ago`. Months set
## that worst case, since years cap at `10y ago` and days reach only
## `29d ago` before months take over. Minutes, hours and seconds cap at 7.
## Truncation keeps width - 1 characters and appends `…`, so width 5 renders
## `11mo…` and width 4 renders `11m…`, where `mo` has been cut to `m` and
## reads as minutes. 5 is the floor. The ` ago` suffix cannot be dropped. A
## column is specified by type, width and expand alone, and the single
## ` ago` literal in the binary comes from the chrono_humanize formatter
## with nothing routing around it. The 4 columns freed go to `command`, the
## same trade as the host width above and the duration removal. The selection
## indicator to the left of the first column is a fixed 4 characters with no
## setting at all — atuin's documentation calls it implicit and the binary's
## config key list has no entry for it, so those 4 columns of left margin are
## not recoverable by any column tuning.
columns = [{ type = "time", width = 5 }, { type = "host", width = 5 }, "command"]

## On by default, and pinned because themes/hacktober.toml depends on it: the
## Syntax* colours it leaves unset are the ones this draws with. It maps to ANSI
## palette entries rather than to RGB, so a command renders `git` at colour 10
## and `--short` at colour 6, following the terminal's own scheme.
syntax_highlight = true

[theme]
## themes/hacktober.toml, matching WezTerm and tmux. Loaded only by the
## interactive TUI, so a broken theme is invisible to every other command.
name = "hacktober"

## Off by default. Turn it on while editing the theme: without it an
## unparsable colour falls back to the default silently, and a name that
## disagrees with the filename is never reported.
debug = false
